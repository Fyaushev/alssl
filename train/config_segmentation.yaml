experiment:
  exp_root_path:  /shared/experiments/active_learning/alssl/dn/
  data_path: /shared/projects/active_learning/
  dataset: cvc
  wandb_entitiy: dnogina

strategy:
  strategy_name: RandomStrategy
  strategy_params: {}
  budget_percent: 1
  budget_per_class: 0
  initial_train_percent: 1
  initial_val_size: 50
  n_iter: 2

coldstart:
  coldstart_name: KMeansColdStart
  coldstart_params: #{}
    samples_per_class: 1 #3
    is_random: False

training:
  backbone: swin
  finetune: False
  optuna_trials: 25
  include_param_loss: True
  blocks_to_retrain: 1
  batch_size: 100
  batch_size_prediction: 500
  num_epochs: 50
  learning_rate: 2e-6
  random_seed: 1
  num_workers: 12
  check_val_every_n_epoch: 1
  optimizer_kwargs:
    weight_decay: 0.001