experiment:
  exp_root_path:  /shared/experiments/active_learning/alssl/dn/
  data_path: /shared/projects/active_learning/
  dataset: imagenet
  wandb_entitiy: dnogina

strategy:
  strategy_name: EntropyStrategy #NeighboursStrategy
  strategy_params: {}
    # num_neighbours: 200
    # metric: cosine
  budget_percent: 1
  initial_train_percent: 1
  initial_val_size: 5000
  n_iter: 2

training:
  backbone: dino
  batch_size: 100
  batch_size_prediction: 1500
  num_epochs: 10
  learning_rate: 0.00001
  random_seed: 0
  num_workers: 16
  check_val_every_n_epoch: 1
  optimizer_kwargs:
    weight_decay: 0.001
  scheduler_kwargs:
    gamma: 0.1
    milestones:
      - 20